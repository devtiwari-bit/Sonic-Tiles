<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 512" width="1180" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1647"/>
      <stop offset="0.55" stop-color="#0d0b22"/>
      <stop offset="1" stop-color="#05060f"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9f6ff"/>
    </linearGradient>
    <linearGradient id="hit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7ad9"/>
      <stop offset="1" stop-color="#ff3cc7"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3cc7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff3cc7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Mark -->
  <g id="mark">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <circle cx="302" cy="400" r="150" fill="url(#sunglow)"/>
    <g fill="#3ff4ff" opacity="0.09">
      <rect x="82" y="0" width="72" height="512"/>
      <rect x="266" y="0" width="72" height="512"/>
    </g>
    <g filter="url(#glow)">
      <rect x="82"  y="44"  width="72" height="112" rx="16" fill="url(#ivory)"/>
      <rect x="174" y="150" width="72" height="112" rx="16" fill="url(#ivory)" opacity="0.92"/>
      <rect x="266" y="288" width="72" height="112" rx="16" fill="url(#hit)"/>
      <rect x="358" y="186" width="72" height="112" rx="16" fill="url(#ivory)" opacity="0.92"/>
    </g>
    <g filter="url(#glow)">
      <rect x="62" y="398" width="388" height="6" rx="3" fill="#3ff4ff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="Orbitron, 'Arial Black', Impact, sans-serif" font-weight="900">
    <text x="560" y="268" font-size="132" letter-spacing="6" fill="#e9fbff" filter="url(#textglow)">PIANO</text>
    <text x="560" y="392" font-size="132" letter-spacing="6" fill="#e9fbff" filter="url(#textglow)">TILES</text>
  </g>
  <text x="566" y="446" font-family="Orbitron, 'Arial Black', Impact, sans-serif" font-weight="700" font-size="26" letter-spacing="8" fill="#3ff4ff">TAP IN TIME WITH THE MUSIC</text>
</svg>
